# Optional. `npm install && npm run dev` needs none of this - the dev script boots
# PostgreSQL as a child process. This file exists for reviewers who would rather
# use Docker, and for a deployment target that expects a compose file.
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: campaign
      POSTGRES_PASSWORD: campaign
      POSTGRES_DB: campaign
    ports: ['5432:5432']
    volumes: ['pgdata:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U campaign']
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build: .
    command: ['node', '--import', 'tsx', 'scripts/migrate.ts']
    environment:
      DATABASE_URL: postgresql://campaign:campaign@postgres:5432/campaign
    depends_on:
      postgres: { condition: service_healthy }

  api:
    build: .
    command: ['node', '--import', 'tsx', 'packages/api/src/index.ts']
    environment:
      DATABASE_URL: postgresql://campaign:campaign@postgres:5432/campaign
      SEND_MODE: mock
      PUBLIC_BASE_URL: http://localhost:3000
      JWT_SECRET: dev-only-not-a-real-secret
    ports: ['3000:3000']
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 10

  worker:
    build: .
    # The ONLY process that schedules anything.
    command: ['node', '--import', 'tsx', 'packages/worker/src/index.ts']
    environment:
      DATABASE_URL: postgresql://campaign:campaign@postgres:5432/campaign
      SEND_MODE: mock
      PUBLIC_BASE_URL: http://localhost:3000
      WORKER_ID: worker-compose
      TRIGGER_FLOOR_AT: '2026-01-01T00:00:00Z'
    depends_on:
      migrate: { condition: service_completed_successfully }

volumes:
  pgdata:
