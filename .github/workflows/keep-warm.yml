# Keep the demo awake.
#
# A free Render web service sleeps after about fifteen minutes idle and cold-starts
# in roughly fifty seconds. A recruiter opening the link and watching a blank tab
# for a minute has already formed an opinion. One always-on service fits inside the
# 750 free instance-hours a month, so this costs nothing.
#
# /healthz is deliberately the target: it is unauthenticated, it touches the
# database, and a failure here is a real signal rather than a warm-up artefact.
name: keep-warm

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

concurrency:
  group: keep-warm
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping /healthz
        env:
          PUBLIC_BASE_URL: ${{ secrets.PUBLIC_BASE_URL }}
        run: |
          if [ -z "$PUBLIC_BASE_URL" ]; then
            echo "PUBLIC_BASE_URL secret is not set; nothing to ping."
            exit 0
          fi
          curl --fail --show-error --silent --max-time 90 --retry 3 --retry-all-errors \
            "${PUBLIC_BASE_URL%/}/healthz"
