# One-click blueprint: the architecture as designed, on one paid platform.
#
# The processes are separate services from the SAME image, because the API must
# never run a scheduler: three API replicas would otherwise mean every job firing
# three times, and a long job would block the health check until the platform
# restarted the container mid-run. packages/api/src/no-scheduler.ts enforces this
# at boot rather than by convention.
#
# PLANS. Render's free tier covers web services and Postgres; Background Workers
# and Cron Jobs are paid, and free Postgres is deleted after 30 days. An earlier
# version of this file claimed `plan: free` on all four, which would not deploy.
# The plans below are the cheapest ones that actually run.
#
# For a ZERO-COST deployment of the same system, see docs/DEPLOY.md: Neon for the
# database, one free Render web service for the API and SPA, and GitHub Actions
# cron driving `packages/worker --once` for the jobs. Same code, same gates, same
# advisory locks — a different trigger.
#
# Migrations are NOT a step here. Both processes run them on boot behind a Postgres
# advisory lock, so the schema is a precondition of the process rather than
# something a deploy checklist has to remember.

databases:
  - name: campaign-engine-db
    databaseName: campaign
    user: campaign
    # Free Postgres on Render is deleted after 30 days. Basic is the cheapest plan
    # that survives, which matters for something linked from a CV.
    plan: basic-256mb
    postgresMajorVersion: '18'

services:
  - type: web
    name: campaign-engine-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /healthz
    dockerCommand: node --import tsx packages/api/src/index.ts
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: campaign-engine-db, property: connectionString }
      # The public demo runs in mock mode. It never contacts a real recipient, and
      # the UI says so on every page that can send.
      #
      # THIS is the service to set `live` on if you want the public storefront at
      # /shop to send real email. The checkout flushes its own messages inside the
      # request — see flushMessages in packages/core/src/delivery/orchestrator.ts —
      # so the API process is the one that needs SMTP_*/TWILIO_*, and the worker
      # below can stay on mock. docs/LIVE-SENDING.md is the runbook.
      - key: SEND_MODE
        value: mock
      # Simulated bounces are right for the seeded dataset and wrong for a page a
      # stranger sees once: from where they are standing, a 5% bounce and a bug
      # look identical.
      - key: MOCK_FAILURE_RATE
        value: '0'
      - key: MOCK_BOUNCE_RATE
        value: '0'
      # The storefront's own limits. It is the only public route that can cause a
      # send, so these are the difference between a demo and an open relay.
      - key: STOREFRONT_DAILY_SEND_BUDGET
        value: '250'
      - key: STOREFRONT_ADDRESS_COOLDOWN_SECONDS
        value: '60'
      # Set by hand AFTER the first deploy, once the URL exists, then redeploy.
      # This builds every unsubscribe and tracking link: wrong here means every
      # opt-out link resolves nowhere, which is what I7 exists to catch.
      - key: PUBLIC_BASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true

  - type: worker
    name: campaign-engine-worker
    runtime: docker
    dockerfilePath: ./Dockerfile
    # Background Workers have no free plan.
    plan: starter
    dockerCommand: node --import tsx packages/worker/src/index.ts
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: campaign-engine-db, property: connectionString }
      - key: SEND_MODE
        value: mock
      # Set by hand AFTER the first deploy, once the URL exists, then redeploy.
      # This builds every unsubscribe and tracking link: wrong here means every
      # opt-out link resolves nowhere, which is what I7 exists to catch.
      - key: PUBLIC_BASE_URL
        sync: false
      - key: WORKER_ID
        value: render-worker
      # A floor IS set here, so the win-back campaign can run. Unset it and the
      # time-trigger job refuses to enrol anybody, which is the intended behaviour.
      - key: TRIGGER_FLOOR_AT
        value: '2026-01-01T00:00:00Z'

  # Resets the demo nightly from seed, so a reviewer arriving at 3am sees the same
  # dataset as one arriving at noon, and so nothing accumulates indefinitely.
  - type: cron
    name: campaign-engine-demo-reset
    runtime: docker
    dockerfilePath: ./Dockerfile
    # Cron Jobs have no free plan.
    plan: starter
    schedule: '0 4 * * *'
    dockerCommand: sh -c "node --import tsx scripts/seed-demo.ts && node --import tsx scripts/simulate.ts"
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: campaign-engine-db, property: connectionString }
      - key: SEND_MODE
        value: mock
